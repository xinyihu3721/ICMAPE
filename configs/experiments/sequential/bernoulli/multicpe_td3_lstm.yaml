# @package _global_
defaults:
  - override /agent/sequential@agent: multicpe_sac_centralq_lstm
  - override /environment: bandit

experiment:
  name: "DecentBernoulliBanditCapacity"
  description: "Decentralized Bernoulli bandit. Multi-agent TD3 with LSTM backbone and discrete actions (Gumbel-Softmax)."
  wandb_group: "TD3_A3P5_DUAL_ACTOR_TGT"

environment:
  bandit_env:
    type: "BernoulliBandit"
    min_value: 0.3
    max_value: 1
    num_magic_actions: 0
    std_magic_action: 0
    minimum_gap: 0
  enable_stopping_action: True



training:
  save_frequency: 50000
  max_training_steps: 1000
  cost_per_timestep: 0  # Enabled only if stopping action is enabled

agent:
  type: "MULTICPE_TD3"            # MULTICPE_TD3
  grad_clipping: 1
  buffer_size: 1000000
  gamma: 0.95                       # discount factor for rewards
  batch_size: 512                # batch size
  num_env_instances: 40
  num_trajectories: 1
  polyak_update_q_network: 0.01    
  frequency_update_i_network: 2      # * times horizon
  replay_ratio: 1
  inference_network_bootstrap_num_batches: 30
  initial_buffer_bootstrap_num_batches: 10
  ent_coef: 'auto'
  actor_learning_rate: 1e-5
  


  # Architecture type - LSTM
  architecture_type: "lstm"

  # Critic network settings (LSTM - no num_heads, attn_dropout, resid_dropout needed)
  critic_network:
    embed_dim: 256
    num_layers: 1
    dropout: 0
    activation_type: "gelu"


  # Inference network settings (LSTM)
  inference_network:
    embed_dim: 256
    num_layers: 1
    dropout: 0
    activation_type: "gelu"

  # Actor network settings (LSTM)
  actor_network:
    embed_dim: 256
    num_layers: 1
    dropout: 0
    activation_type: "gelu"
    shared_critic: False
    gumbel_temperature: 1.0  # Gumbel-Softmax tau in actor_lstm_ddpg
    gumbel_tau_min: 0.3
    td3_policy_delay: 5
    

