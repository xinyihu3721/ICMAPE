# Robot MULTICPE SAC (``icmape.agents.robot.sequential.multicpe_sac_robot.MULTICPE_SAC_ROBOT``).
# Loaded only from Hydra root ``config_robot.yaml`` via ``agent/robot@agent: robot_multicpe_sac``.
# Networks are placeholders until real architectures are wired in.
type: "ROBOT_MULTICPE_SAC"
learning_rate: 1e-4
inference_learning_rate: 5e-5
cost_learning_rate: 3e-4
ent_learning_rate: 1e-5
critic_learning_rate: 5e-5
actor_learning_rate: 1e-5
final_learning_rate: 1e-5
grad_clipping: 2
buffer_size: 5000000
gamma: 0.95
batch_size: 256
num_env_instances: 8
num_trajectories: 2
polyak_update_q_network: 0.01
frequency_update_i_network: 2
replay_ratio: 1
inference_network_bootstrap_num_batches: 30
initial_buffer_bootstrap_num_batches: 10
confidence_level: 0.9
log_interval: 1000
ent_coef: "auto"
architecture_type: "cnn_lstm"

actor_network:
  embed_dim: 256
  num_layers: 1
  dropout: 0.1
  activation_type: "gelu"
  shared_critic: false

critic_network:
  embed_dim: 256
  num_layers: 1
  dropout: 0.1
  activation_type: "gelu"

inference_network:
  type: "cnn"
  grid_size: 15
  hidden_channels: 8
  num_layers: 3
  activation: "relu"